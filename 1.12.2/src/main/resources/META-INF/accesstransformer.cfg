# Transcendence Zombie AccessTransformer -- Minecraft 1.12.2 / Forge 14.23.5.2860
#
# Two lines, and both are the "public-f" form: 1.12.2 needs a much smaller widening set than 1.16.5 did,
# and nothing at all is needed for entity removal here (`Entity#setDead` is already public) or for the
# weather (the WorldInfo setters are public, see TranscenEvents#forceNightAndStorm).
#
# Names are SRG identifiers, because a reobfuscated production jar contains those and not the mapped
# names -- the same convention the 1.16.5 cfg used. The MCP name is given as the trailing comment.
#
# THIS FILE IS ONLY READ IF THE JAR MANIFEST LISTS IT. See the FMLAT attribute in build.gradle: 1.12.2's
# CoreModManager asks the manifest which AT files a coremod jar carries, and a file that is present in
# META-INF but not named there is silently ignored. That failure mode is invisible in the development
# workspace, where ForgeGradle applies this file from the resource tree while compiling, and only shows
# up in the built jar as "overrides final method func_110143_aJ".

# EntityLivingBase#getHealth and #getMaxHealth are both declared `final` on 1.12.2, which would make the
# 114514 health read and the 114514 maximum impossible to install. Dropping `final` is what lets
# TranscenZombie override them, and it is the whole reason this file exists.
#
# `public-f` rather than `public`: the methods are already public, and a bare `public` entry would widen
# the modifier without touching the finality that is actually in the way.
public-f net.minecraft.entity.EntityLivingBase func_110143_aJ()F # getHealth
public-f net.minecraft.entity.EntityLivingBase func_110138_aP()F # getMaxHealth
