// Transcendence Zombie -- standalone verifier for the coremod's bytecode injection.
//
// The coremod is the one part of this port that a compile cannot check: a transformer that emits
// unverifiable bytecode, or that appends its injection after the original return, produces a jar that
// builds cleanly and then either crashes with a VerifyError at class load or runs with the feature
// silently dead. Both of those happened while writing it. This compiles two stand-in copies of the real
// targets, runs the real TranscenTransformer over them, loads the results so the JVM verifier has to
// accept them, and asserts that both injections actually take effect.
//
// Run with:  gradlew verifyTransformer
//
// It is deliberately not part of `build`. It is a development check, and wiring it into the main build
// would put a class-loading test in the path of every packaging run for no benefit.

configurations {
    verifierAsm
}

dependencies {
    verifierAsm 'org.ow2.asm:asm:6.2'
    verifierAsm 'org.ow2.asm:asm-tree:6.2'
}

task compileVerifierStandins(type: JavaCompile, dependsOn: 'classes') {
    description = 'Compiles the stand-in Minecraft classes and the coremod test harness.'
    // Compiled against the JDK and the main output only. Including the real Minecraft artifact would
    // defeat the point: the harness has to be handed the *untransformed* originals.
    source = fileTree('dev-tests/src') { include '**/*.java' }
    // `minecraft` is the ForgeGradle configuration holding the full Minecraft-and-Forge classpath, which
    // is where launchwrapper (and therefore IClassTransformer) comes from. compileClasspath alone does not
    // carry it, because the mod's own sources never name that interface.
    classpath = files(sourceSets.main.output) +
            configurations.verifierAsm +
            configurations.minecraft
    destinationDir = file("$buildDir/verifier/classes")
    options.encoding = 'UTF-8'
    sourceCompatibility = '1.8'
    targetCompatibility = '1.8'
}

task verifyTransformer(type: JavaExec, dependsOn: 'compileVerifierStandins') {
    description = 'Runs the coremod transformer over stand-in classes and verifies both injections.'
    group = 'verification'
    classpath = files(sourceSets.main.output) +
            configurations.verifierAsm +
            configurations.minecraft +
            files("$buildDir/verifier/classes")
    main = 'TransformerHarness'
    args = [
            file("$buildDir/verifier/classes").absolutePath,
            file("$buildDir/verifier/out").absolutePath
    ]
}

// The entity guard transformer has the same failure mode as the one above and one more of its own: its
// table is a set of names and descriptors, and a table that matches nothing compiles, builds and does
// nothing at all. This runs the real transformer over stand-in targets twice - once under the plain names
// and once under the obfuscated names read out of Forge's own deobfuscation data, which is what a coremod
// transformer actually sees in production - loads the results so the verifier has to accept them, and then
// calls the guarded methods and checks what happened.
//
// None of it is part of `build`; it is a development check.
task verifyEntityGuard(type: JavaExec, dependsOn: 'compileVerifierStandins') {
    description = 'Runs the entity guard transformer over stand-in classes and verifies every guard fires.'
    group = 'verification'
    classpath = files(sourceSets.main.output) +
            configurations.verifierAsm +
            configurations.minecraft +
            files("$buildDir/verifier/classes")
    main = 'EntityGuardHarness'
    args = [
            file("$buildDir/verifier/classes").absolutePath,
            file("$buildDir/verifier/guard-out").absolutePath
    ]
}

// The AllReturn rewrite, run over stand-in classes in both naming states. The point here is different
// again three things: the guard this one inserts is a GETSTATIC on AllReturn followed by a frame-joining
// branch, and without the frame node the verifier rejects every rewritten class; a transformer may not name
// a class of this mod at all, because it runs inside the class loader's transformer loop (reading
// AllReturn.allReturn from there is what killed the launch with ClassCircularityError); and the injected
// guard has to answer a correct default for every return sort.
//
// The third argument is the mod's own class directory: the circularity check needs a class loader that can
// see this mod's classes and the parent's, so it can put the real transformers on the chain and then define
// a class while that chain runs.
task verifyAllReturn(type: JavaExec, dependsOn: 'compileVerifierStandins') {
    description = 'Runs the AllReturn rewrite and verifies the injected guards verify and take effect.'
    group = 'verification'
    classpath = files(sourceSets.main.output) +
            configurations.verifierAsm +
            configurations.minecraft +
            files("$buildDir/verifier/classes")
    main = 'AllReturnHarness'
    args = [
            file("$buildDir/verifier/classes").absolutePath,
            file("$buildDir/verifier/allreturn-out").absolutePath,
            file("$buildDir/sourcesSets/main").absolutePath
    ]
}

// TranscendenceZombieFullPower. Its failure mode is that it changes nothing and the game starts perfectly,
// so a build that does nothing at all is indistinguishable from one that works - every assertion here is
// written to be able to fail, and the run carries a positive control that measures the same class before
// the filter, where the injected body must still be there.
//
// The stand-in coremod is modelled on a real one rather than described: one transform() that
// widens a field for its own renderer and replaces a method body to change behaviour. The filter has to
// keep the widening (dropping it is what made the game fail to start) and drop the body.
task verifyFullPower(type: JavaExec, dependsOn: 'compileVerifierStandins') {
    description = 'Runs FullPowerFilter over a coremod-modified class and verifies ATs survive and bodies do not.'
    group = 'verification'
    classpath = files(sourceSets.main.output) +
            configurations.verifierAsm +
            configurations.minecraft +
            files("$buildDir/verifier/classes")
    main = 'FullPowerHarness'
    args = [
            file("$buildDir/verifier/classes").absolutePath,
            // The mod's own output, so the harness can scan the transformer's instructions for a mention
            // of another class of this mod. That is the shape that puts a class load inside a class load.
            sourceSets.main.output.classesDirs.singleFile.absolutePath
    ]
}

// ---------------------------------------------------------------------------------------------
// Note on end-to-end testing
// ---------------------------------------------------------------------------------------------
//
// There is deliberately no runServerSmoke task here, and the reason is worth recording because it looks
// like an omission.
//
// `gradlew runServer` cannot load this mod -- or any mod -- in this workspace. FMLContainer's construction
// calls FMLNetworkHandler.registerChannel(Loader.instance().activeModContainer(), side), and in a
// dedicated-server development launch that argument is null. NetworkRegistry.newChannel then evaluates
// `name.startsWith("FML") && !("FML".equals(container.getModId()))` on Forge's own channel name and throws
// a NullPointerException on the null container, forcing FML out of PREINITIALIZATION.
//
// That was measured, not assumed: a separate pristine ForgeGradle 3 project for 1.12.2 containing one empty
// @Mod class and no other code crashes at the identical line. It is a property of the development launch,
// not of this mod. The built jar was therefore verified end to end against a real (non-development) Forge
// 1.12.2 server instead. That run is what caught the two packaging bugs documented in build.gradle: the
// object-form mcmod.info, and the missing FMLAT manifest attribute.
//
// `gradlew verifyTransformer` above is the part of the check that can run here, and it is the part that
// matters most: it is the only thing that can catch a coremod emitting unverifiable bytecode.
