public net.minecraft.world.entity.Entity f_19861_ # valid
public net.minecraft.world.entity.Entity isAddedToWorld # mapped name, no SRG id published
# removalReason backs the final isRemoved(). Overriding remove() does not stop a delete that sets
# this field directly, so TranscenZombie reads it to detect that and nulls it back out, which is what
# keeps the zombie rendering after being "deleted".
public net.minecraft.world.entity.Entity f_146795_ # removalReason
# setRemoved is final in vanilla and is the only writer of removalReason, which is what isRemoved()
# reports. Dropping the final lets TranscenZombie override it as a no-op, which means outside code that
# goes through setRemoved instead of remove() cannot mark the zombie as gone either.
public-f net.minecraft.world.entity.Entity m_142467_(Lnet/minecraft/world/entity/Entity$RemovalReason;)V # setRemoved
# setPosRaw is the lowest-level position writer and is final in vanilla. Dropping the final is what
# lets TranscenZombie refuse relocations; see the override in entity/TranscenZombie.java.
# The SRG id here is m_20343_, and that was worth checking rather than assuming: in this version
# m_20219_ looks like the obvious candidate but takes a Vec3 and merely forwards to m_20343_, which is
# the (DDD)V method that actually writes the position field. An AT line naming the wrong id does not
# fail -- it is silently ignored -- so the mod appeared to have a guard that never existed.
public-f net.minecraft.world.entity.Entity m_20343_(DDD)V # setPosRaw

