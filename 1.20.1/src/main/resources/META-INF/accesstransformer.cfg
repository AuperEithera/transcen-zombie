# Transcendence Zombie AccessTransformer
# Every member below is touched by this mod, either through java.lang.reflect (the entity-storage
# surgery in util/CustomEntityRemover.java) or through plain Java member access (the compile-time
# proof in util/AccessTransformerVerifier.java). Widening them to public is what keeps the
# reflective lookups resolving identically in development and in a reobfuscated production jar.
# Names are SRG (f_ / m_) identifiers. Forge also accepts mapped names, so members whose SRG id is
# absent from the public mapping files are targeted by their mapped name instead; each such line
# says so in a trailing comment.
# Minecraft 1.20.1 / Forge 47.4.26

# net.minecraft.world.entity.LivingEntity
