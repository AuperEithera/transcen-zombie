# Transcendence Zombie AccessTransformer -- Minecraft 1.16.5 / Forge 36.2.34
#
# 1.16.5 needs far less than 1.20.1 did. Entity removal is driven by ServerWorld rather than by the
# entity itself, so the three-layer unwrap described in TranscenEvents is reached by writing the
# `removed` flag and letting ServerWorld#removeEntity finish the job. Nothing about entity storage has
# to be widened, and the reflection used on 1.20.1 (util/CustomEntityRemover) does not exist here.
#
# Names are SRG identifiers, because a reobfuscated production jar contains those, not the mapped names.

# getMaxHealth is final in 1.16.5, which would otherwise make the 114514 maximum impossible to install.
public-f net.minecraft.entity.LivingEntity func_110138_aP()F # getMaxHealth

# FireballEntity's only power-carrying constructor argument is the int field below; the constructor
# itself takes no power. Widening the field is what lets the attack land at explosion power 4.
public net.minecraft.entity.projectile.FireballEntity field_92057_e # explosionPower

# LightningBoltEntity keeps its lifecycle in two private ints and seeds them from a random draw, so a
# bolt lasts only a handful of ticks. That is short enough for the server's entity tracker to discard it
# before the spawn packet reaches the client, which is exactly what was measured: the client census saw
# its own zombie but never a single bolt. Widening both lets TranscenLightningBolt hold the bolt open for
# a fixed, deliberate lifetime instead of a random one.
public net.minecraft.entity.effect.LightningBoltEntity field_70262_b # lightningState
public net.minecraft.entity.effect.LightningBoltEntity field_70263_c # boltLivingTime
